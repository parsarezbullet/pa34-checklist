<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kneeboard</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap">
<style>
  :root{
    --bg:#F4F6F4; --surface:#FFFFFF; --surface2:#EDF0ED;
    --ink:#171D1A; --muted:#5C6662; --faint:#8B948F;
    --line:#DFE4DF; --line2:#CBD2CC;
    --mag:#B0107A; --mag-bg:#FBEDF5;
    --grn:#177A45; --grn-bg:#EAF5EE;
    --amb:#96660A; --amb-bg:#FBF3E2;
    --red:#B3261E; --red-bg:#FBECEA;
    --val:#0A6E8C;
    --chip:#E7EBE7;
    --shadow:0 1px 3px rgba(20,28,24,.10),0 6px 18px rgba(20,28,24,.06);
    --sheet-shadow:0 -8px 32px rgba(10,14,12,.18);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0A0D0C; --surface:#141917; --surface2:#1B211E;
      --ink:#E4EAE5; --muted:#939D97; --faint:#6B756F;
      --line:#242B27; --line2:#333C37;
      --mag:#F45FB5; --mag-bg:#2A1522;
      --grn:#41C07C; --grn-bg:#12271B;
      --amb:#E2A93F; --amb-bg:#292013;
      --red:#FF6E61; --red-bg:#2C1512;
      --val:#7CD6E8;
      --chip:#1E2521;
      --shadow:0 1px 3px rgba(0,0,0,.5),0 6px 18px rgba(0,0,0,.35);
      --sheet-shadow:0 -8px 32px rgba(0,0,0,.6);
    }
  }
  :root[data-theme="dark"]{
    --bg:#0A0D0C; --surface:#141917; --surface2:#1B211E;
    --ink:#E4EAE5; --muted:#939D97; --faint:#6B756F;
    --line:#242B27; --line2:#333C37;
    --mag:#F45FB5; --mag-bg:#2A1522;
    --grn:#41C07C; --grn-bg:#12271B;
    --amb:#E2A93F; --amb-bg:#292013;
    --red:#FF6E61; --red-bg:#2C1512;
    --val:#7CD6E8;
    --chip:#1E2521;
    --shadow:0 1px 3px rgba(0,0,0,.5),0 6px 18px rgba(0,0,0,.35);
    --sheet-shadow:0 -8px 32px rgba(0,0,0,.6);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg); color:var(--ink);
    font-family:'IBM Plex Sans',system-ui,-apple-system,sans-serif;
    font-size:16px; line-height:1.45;
    min-height:100vh;
    -webkit-text-size-adjust:100%;
  }
  button{font-family:inherit; color:inherit; background:none; border:none; cursor:pointer; padding:0;}
  input,textarea,select{font-family:inherit; font-size:16px; color:var(--ink); background:var(--surface); border:1px solid var(--line2); border-radius:8px; padding:10px 12px;}
  input:focus,textarea:focus,select:focus,button:focus-visible{outline:2px solid var(--val); outline-offset:1px;}
  .mono{font-family:'IBM Plex Mono',ui-monospace,monospace;}
  .cond{font-family:'Barlow Condensed','IBM Plex Sans',sans-serif; text-transform:uppercase; letter-spacing:.06em;}

  #app{max-width:640px; margin:0 auto; padding:0 0 96px;}
  @media(min-width:900px){ #app.run-mode{max-width:960px;} }

  /* ---------- top bar ---------- */
  .topbar{
    position:sticky; top:0; z-index:40;
    background:var(--bg);
    border-bottom:1px solid var(--line);
    padding:10px 14px 8px;
    display:flex; align-items:center; gap:10px;
  }
  .topbar .tb-title{flex:1; min-width:0;}
  .topbar h1{
    font-family:'Barlow Condensed',sans-serif; text-transform:uppercase; letter-spacing:.05em;
    font-size:20px; font-weight:700; margin:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .topbar .sub{font-size:12px; color:var(--muted); margin:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .iconbtn{
    width:42px; height:42px; flex:0 0 auto;
    display:flex; align-items:center; justify-content:center;
    border-radius:10px; border:1px solid var(--line);
    background:var(--surface); color:var(--muted);
    font-size:17px;
  }
  .iconbtn:active{background:var(--surface2);}
  .pctring{
    width:42px;height:42px;flex:0 0 auto;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;
    color:var(--muted);
  }

  /* ---------- phase rail (mobile horizontal) ---------- */
  .rail{
    position:sticky; top:61px; z-index:30;
    background:var(--bg);
    border-bottom:1px solid var(--line);
    display:flex; gap:8px; overflow-x:auto; padding:10px 14px;
    scrollbar-width:none;
  }
  .rail::-webkit-scrollbar{display:none;}
  .chip{
    flex:0 0 auto; display:flex; align-items:center; gap:7px;
    padding:8px 13px; border-radius:999px;
    background:var(--chip); border:1px solid transparent;
    font-family:'Barlow Condensed',sans-serif; text-transform:uppercase; letter-spacing:.05em;
    font-size:15px; font-weight:600; color:var(--muted);
    white-space:nowrap;
  }
  .chip .dot{width:8px;height:8px;border-radius:50%;background:var(--line2);flex:0 0 auto;}
  .chip.done{color:var(--grn);}
  .chip.done .dot{background:var(--grn);}
  .chip.part .dot{background:var(--amb);}
  .chip.active{background:var(--surface); border-color:var(--mag); color:var(--ink); box-shadow:var(--shadow);}
  .chip.active .dot{background:var(--mag);}
  /* emergency checklist: red accent instead of magenta */
  .emerg .chip.active{border-color:var(--red);}
  .emerg .chip.active .dot{background:var(--red);}
  .emerg .phasehead h2{color:var(--red);}
  .emerg .row.current{background:var(--red-bg);}
  .emerg .row.current::before{background:var(--red);}
  .cl-card.emg{border-left:4px solid var(--red);}
  .cl-card.emg h3{color:var(--red);}

  /* ---------- desktop / iPad split ---------- */
  .runwrap{display:block;}
  .sidebar{display:none;}
  @media(min-width:900px){
    .runwrap{display:grid; grid-template-columns:230px 1fr; gap:24px; padding:0 20px;}
    .rail{display:none;}
    .sidebar{display:block; position:sticky; top:75px; align-self:start; padding-top:16px;}
    .sidebar .chip{display:flex; width:100%; margin-bottom:6px; border-radius:10px; justify-content:flex-start;}
    .sidebar .chip .cnt{margin-left:auto; font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:0;}
    .phasepane{min-width:0; max-width:640px;}
  }

  /* ---------- checklist rows ---------- */
  .phasehead{
    display:flex; align-items:baseline; gap:10px;
    padding:22px 16px 10px;
  }
  .phasehead h2{
    margin:0; font-family:'Barlow Condensed',sans-serif; text-transform:uppercase;
    letter-spacing:.07em; font-size:26px; font-weight:700;
  }
  .phasehead .count{font-family:'IBM Plex Mono',monospace; font-size:13px; color:var(--muted);}
  .phasehead .resetph{margin-left:auto; font-size:12px; color:var(--faint); text-decoration:underline; text-underline-offset:3px;}

  .card{
    background:var(--surface); border:1px solid var(--line); border-radius:14px;
    margin:0 12px; overflow:hidden; box-shadow:var(--shadow);
  }
  .row{
    display:flex; align-items:center; gap:12px; width:100%; text-align:left;
    min-height:54px; padding:11px 14px;
    border-bottom:1px solid var(--line);
    position:relative;
    transition:background .12s;
  }
  .row:last-child{border-bottom:none;}
  .row .box{
    width:24px;height:24px;flex:0 0 auto;border-radius:7px;
    border:2px solid var(--line2); display:flex;align-items:center;justify-content:center;
    font-size:14px; color:transparent; transition:all .12s;
  }
  .row .rc{flex:1; min-width:0; display:flex; align-items:baseline; gap:8px;}
  .row .ch{font-weight:600; font-size:16.5px;}
  .row .lead{flex:1; border-bottom:2px dotted var(--line2); transform:translateY(-4px); min-width:16px;}
  .row .rv{
    font-family:'IBM Plex Mono',monospace; font-weight:600; font-size:15px;
    color:var(--val); text-align:right; white-space:nowrap;
  }
  .row .nt{display:block; font-size:12.5px; color:var(--amb); font-weight:500; margin-top:2px;}
  .row.current{background:var(--mag-bg);}
  .row.current::before{
    content:''; position:absolute; left:0; top:0; bottom:0; width:4px; background:var(--mag);
  }
  .row.done .box{background:var(--grn); border-color:var(--grn); color:#fff;}
  .row.done .ch,.row.done .rv{opacity:.42;}
  .row.done .nt{opacity:.42;}
  .row.done .lead{opacity:.35;}
  .srow{
    padding:14px 16px 6px; font-family:'Barlow Condensed',sans-serif; text-transform:uppercase;
    letter-spacing:.09em; font-size:15px; font-weight:700; color:var(--amb);
    border-bottom:1px solid var(--line); background:var(--surface2);
    display:flex; align-items:center; gap:8px; padding-top:9px; padding-bottom:9px;
  }
  .nrow{
    padding:10px 16px; font-size:13px; color:var(--muted); font-style:italic;
    border-bottom:1px solid var(--line); background:var(--surface2);
  }

  /* ---------- phase complete banner ---------- */
  .donebanner{
    margin:14px 12px 0; border-radius:14px;
    background:var(--grn-bg); border:1px solid var(--grn);
    padding:16px; display:flex; align-items:center; gap:12px;
  }
  .donebanner .dtxt{flex:1;}
  .donebanner .dtxt b{color:var(--grn); font-family:'Barlow Condensed',sans-serif; text-transform:uppercase; letter-spacing:.06em; font-size:18px;}
  .nextbtn{
    background:var(--grn); color:#fff; border-radius:10px;
    padding:12px 18px; font-weight:700; font-size:15px;
    font-family:'Barlow Condensed',sans-serif; text-transform:uppercase; letter-spacing:.06em;
    flex:0 0 auto;
  }
  .allday{
    margin:14px 12px 0; border-radius:14px; text-align:center;
    background:var(--grn-bg); border:1px solid var(--grn); padding:22px 16px;
  }
  .allday b{color:var(--grn); font-family:'Barlow Condensed',sans-serif; text-transform:uppercase; letter-spacing:.07em; font-size:22px; display:block; margin-bottom:4px;}
  .allday span{color:var(--muted); font-size:13px;}

  /* ---------- bottom bar ---------- */
  .bottombar{
    position:fixed; bottom:0; left:0; right:0; z-index:45;
    display:flex; justify-content:center; gap:10px;
    padding:10px 14px calc(10px + env(safe-area-inset-bottom));
    background:var(--bg); border-top:1px solid var(--line);
  }
  .bb-btn{
    display:flex; align-items:center; gap:8px;
    padding:11px 20px; border-radius:12px;
    background:var(--surface); border:1px solid var(--line2);
    font-family:'Barlow Condensed',sans-serif; text-transform:uppercase; letter-spacing:.06em;
    font-weight:700; font-size:16px; color:var(--ink);
    box-shadow:var(--shadow);
  }
  .bb-btn.vspd{color:var(--val); border-color:var(--val);}

  /* ---------- home ---------- */
  .home-hero{padding:34px 18px 10px;}
  .home-hero .brand{
    font-family:'Barlow Condensed',sans-serif; text-transform:uppercase;
    font-size:34px; font-weight:700; letter-spacing:.08em; margin:0;
  }
  .home-hero .brand .tick{color:var(--grn);}
  .home-hero p{margin:4px 0 0; color:var(--muted); font-size:14px;}
  .cl-card{
    display:block; width:100%; text-align:left;
    background:var(--surface); border:1px solid var(--line); border-radius:16px;
    box-shadow:var(--shadow); margin:14px 14px 0; width:auto;
    padding:18px; position:relative;
  }
  .cl-card h3{margin:0; font-family:'Barlow Condensed',sans-serif; text-transform:uppercase; letter-spacing:.05em; font-size:24px; font-weight:700;}
  .cl-card .clsub{color:var(--muted); font-size:13px; margin-top:2px;}
  .cl-card .clmeta{display:flex; gap:14px; margin-top:12px; align-items:center;}
  .cl-card .clmeta .m{font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--faint);}
  .cl-card .pbar{flex:1; height:5px; border-radius:3px; background:var(--surface2); overflow:hidden;}
  .cl-card .pbar i{display:block; height:100%; background:var(--grn); border-radius:3px;}
  .cl-actions{display:flex; gap:14px; margin:8px 22px 0;}
  .cl-actions button{font-size:12.5px; color:var(--muted); text-decoration:underline; text-underline-offset:3px;}
  .cl-actions button.danger{color:#B3403A;}
  .newbtn{
    display:flex; align-items:center; justify-content:center; gap:10px;
    margin:22px 14px 0; width:auto; padding:16px;
    border:2px dashed var(--line2); border-radius:16px;
    color:var(--muted); font-weight:600; font-size:15px;
  }
  .homefoot{margin:30px 18px 0; font-size:11.5px; color:var(--faint); line-height:1.5;}

  /* ---------- V-speeds sheet ---------- */
  .scrim{position:fixed; inset:0; background:rgba(8,10,9,.45); z-index:50;}
  .sheet{
    position:fixed; left:0; right:0; bottom:0; z-index:51;
    background:var(--surface); border-radius:20px 20px 0 0;
    box-shadow:var(--sheet-shadow);
    max-height:82vh; overflow-y:auto;
    padding:8px 18px calc(20px + env(safe-area-inset-bottom));
    max-width:640px; margin:0 auto;
  }
  .sheet .grab{width:42px;height:4px;border-radius:2px;background:var(--line2);margin:6px auto 12px;}
  .sheet h3{
    font-family:'Barlow Condensed',sans-serif; text-transform:uppercase; letter-spacing:.07em;
    font-size:20px; margin:14px 0 6px; color:var(--val);
  }
  .vtable{width:100%; border-collapse:collapse;}
  .vtable td{padding:8px 0; border-bottom:1px solid var(--line); font-size:14.5px; vertical-align:baseline;}
  .vtable td.vl b{font-family:'IBM Plex Mono',monospace; font-weight:600; margin-right:8px;}
  .vtable td.vk{text-align:right; font-family:'IBM Plex Mono',monospace; font-weight:700; color:var(--val); white-space:nowrap;}
  .vtable td.vk small{color:var(--faint); font-weight:400;}
  .sheet .notes p{font-size:13px; color:var(--muted); margin:6px 0; padding-left:14px; position:relative;}
  .sheet .notes p::before{content:'▸'; position:absolute; left:0; color:var(--amb);}

  /* ---------- editor ---------- */
  .ed-section{margin:18px 14px 0;}
  .ed-section label{display:block; font-size:12px; font-weight:600; color:var(--muted); text-transform:uppercase; letter-spacing:.06em; margin-bottom:6px;}
  .ed-section input[type=text]{width:100%;}
  .ed-phase{background:var(--surface); border:1px solid var(--line); border-radius:14px; margin:14px 14px 0; overflow:hidden;}
  .ed-phead{display:flex; align-items:center; gap:8px; padding:12px 12px;}
  .ed-phead input{flex:1; min-width:0; font-weight:700; font-family:'Barlow Condensed',sans-serif; text-transform:uppercase; letter-spacing:.05em; font-size:18px;}
  .ed-item{display:flex; align-items:center; gap:6px; padding:7px 12px; border-top:1px solid var(--line);}
  .ed-item input{flex:1; min-width:0; padding:8px 10px; font-size:14px;}
  .ed-item input.chl{flex:1.3; font-weight:600;}
  .ed-item input.rsp{color:var(--val); font-family:'IBM Plex Mono',monospace;}
  .ed-item.k-section input.chl{color:var(--amb); text-transform:uppercase; letter-spacing:.04em;}
  .ed-item.k-note input.chl{font-style:italic; font-weight:400; color:var(--muted);}
  .mini{
    width:34px; height:34px; flex:0 0 auto; border-radius:8px;
    display:flex; align-items:center; justify-content:center;
    border:1px solid var(--line); color:var(--muted); font-size:14px; background:var(--surface2);
  }
  .mini.del{color:#B3403A;}
  .ed-add{display:flex; gap:8px; padding:10px 12px; border-top:1px solid var(--line); flex-wrap:wrap;}
  .ed-add button{font-size:13px; font-weight:600; color:var(--val); padding:8px 12px; border:1px dashed var(--line2); border-radius:8px;}
  .ed-bigadd{display:block; margin:16px 14px 0; width:auto; padding:14px; text-align:center; border:2px dashed var(--line2); border-radius:14px; color:var(--muted); font-weight:600;}
  .ed-save{
    background:var(--grn); color:#fff; border-radius:12px; padding:12px 26px;
    font-family:'Barlow Condensed',sans-serif; text-transform:uppercase; letter-spacing:.07em;
    font-weight:700; font-size:17px;
  }
  .ed-vrow{display:flex; gap:6px; padding:6px 0; align-items:center;}
  .ed-vrow input{flex:1; padding:8px 10px; font-size:14px;}
  .ed-vrow input.num{flex:0 0 76px; font-family:'IBM Plex Mono',monospace; text-align:right;}
  .io-box{width:100%; height:150px; font-family:'IBM Plex Mono',monospace; font-size:12px;}

  .armed{background:var(--red) !important; color:#fff !important; border-color:var(--red) !important;}
  .toast{
    position:fixed; left:50%; transform:translateX(-50%);
    bottom:calc(84px + env(safe-area-inset-bottom)); z-index:60;
    background:var(--ink); color:var(--bg); padding:10px 18px; border-radius:10px;
    font-size:14px; font-weight:600; box-shadow:var(--shadow);
    animation:toastin .2s ease-out;
  }
  @keyframes toastin{from{opacity:0; transform:translateX(-50%) translateY(8px);}to{opacity:1; transform:translateX(-50%) translateY(0);}}
  @media(prefers-reduced-motion:reduce){ *{transition:none!important; animation:none!important;} }

  /* ---- edit lock + config additions ---- */
  .lockrow{display:flex; gap:10px; align-items:center; margin:18px 22px 4px;}
  .lockbtn{font-size:12.5px; color:var(--muted); border:1px solid var(--line2); border-radius:9px; padding:8px 13px; font-weight:600;}
  .lockbtn.on{color:var(--val); border-color:var(--val);}
  .lockhint{font-size:12px; color:var(--faint);}
  .pinwrap{display:flex; gap:8px; margin:8px 22px 0;}
  .pinwrap input{flex:1; min-width:0; font-family:'IBM Plex Mono',monospace; letter-spacing:.45em; text-align:center; font-size:18px;}
  .clsort{display:flex; gap:6px; margin:8px 22px 0;}
  .ed-more{display:flex; gap:6px; align-items:center; padding:2px 12px 10px; flex-wrap:wrap;}
  .ed-more select{font-size:13px; padding:7px 8px;}
  .ed-more button{font-size:12.5px; font-weight:600; color:var(--val); padding:7px 11px; border:1px dashed var(--line2); border-radius:8px;}
  .ed-more button.del{color:#B3403A;}
  .ed-more .lbl{font-size:11.5px; color:var(--faint); text-transform:uppercase; letter-spacing:.06em;}
  .vrow{display:flex; gap:6px; align-items:center; padding:6px 12px; border-top:1px solid var(--line);}
  .vrow input{min-width:0; padding:7px 8px; font-size:13.5px;}
  .vrow input.va{flex:.9; font-weight:700;}
  .vrow input.vd{flex:1.7;}
  .vrow input.vk,.vrow input.vm{flex:.75; font-family:'IBM Plex Mono',monospace; color:var(--val);}
  .ed-toggle{display:flex; align-items:center; gap:10px; margin:18px 14px 0; font-size:14px; color:var(--ink);}
  .ed-toggle input{width:20px; height:20px; accent-color:var(--val); padding:0;}
</style>

<div id="app"></div>

/* ================= storage ================= */
function loadLists(){
  try{
    const raw=localStorage.getItem(LSK);
    if(raw){ const a=JSON.parse(raw); if(Array.isArray(a)&&a.length) return a; }
  }catch(e){}
  return [JSON.parse(JSON.stringify(seneca)),JSON.parse(JSON.stringify(senecaEmerg))];
}
let lists=loadLists();
function saveLists(){ try{localStorage.setItem(LSK,JSON.stringify(lists));}catch(e){} }
if(!localStorage.getItem(LSK)) saveLists();

function chkKey(id){return 'kb_state_'+id;}
function loadChk(id){ try{return JSON.parse(localStorage.getItem(chkKey(id))||'{}');}catch(e){return{};} }
function saveChk(id,o){ try{localStorage.setItem(chkKey(id),JSON.stringify(o));}catch(e){} }

/* seed migration: replace/add built-in lists when their bundled version advances */
const SEED_V=8;
(function(){
  try{
    const v=+(localStorage.getItem('kb_seed_v')||1);
    if(v<SEED_V){
      [seneca,senecaEmerg].forEach(sd=>{
        const cp=JSON.parse(JSON.stringify(sd));
        const ix=lists.findIndex(l=>l.id===sd.id);
        /* Only overwrite a bundled list the user has never edited. Once they've
           edited it, their copy wins and a seed bump leaves it alone. */
        if(ix>=0){
          if(!lists[ix].edited){ lists[ix]=cp; localStorage.removeItem(chkKey(sd.id)); }
        }
        else lists.push(cp);
      });
      saveLists();
    }
    localStorage.setItem('kb_seed_v',SEED_V);
  }catch(e){}
})();

/* built-in lists always come back if missing (e.g. accidental delete on an old build) */
const BUILTIN=new Set([seneca.id,senecaEmerg.id]);
(function(){
  let changed=false;
  [seneca,senecaEmerg].forEach(sd=>{
    if(!lists.some(l=>l&&l.id===sd.id)){ lists.push(JSON.parse(JSON.stringify(sd))); changed=true; }
  });
  if(changed) saveLists();
})();

/* theme: 'auto' | 'light' | 'dark' */
let theme=localStorage.getItem('kb_theme')||'auto';
function applyTheme(){
  const r=document.documentElement;
  if(theme==='auto') r.removeAttribute('data-theme'); else r.setAttribute('data-theme',theme);
  try{localStorage.setItem('kb_theme',theme);}catch(e){}
}
applyTheme();

function checkables(ph){ return ph.items.filter(it=>!it.k||it.k==='item'); }

function phaseStats(cl,chk){
  return cl.phases.map((ph,pi)=>{
    let tot=0,done=0;
    ph.items.forEach((it,ii)=>{ if(!it.k||it.k==='item'){tot++; if(chk[pi+'.'+ii])done++;} });
    return {tot,done};
  });
}

      if(pin.value===EDIT_PIN){ unlocked=true; pinOpen=false; render(); toast('Editing unlocked'); }
      else { pin.value=''; pin.focus(); toast('Wrong PIN'); }

    pg.onclick=tryPin;
    pin.onkeydown=e=>{ if(e.key==='Enter') tryPin(); };

  const xa=document.getElementById('exportall');

  };
  const nb=document.getElementById('newcl');
  if(nb) nb.onclick=()=>{ openEditor(null); };
  const ib=document.getElementById('importcl');
  if(ib) ib.onclick=()=>{ ioMode='import'; render(); setTimeout(()=>{const t=document.getElementById('iobox'); if(t)t.scrollIntoView({block:'center'});},50); };
  const ic=document.getElementById('ioclose'); if(ic) ic.onclick=()=>{ ioMode=null; render(); };
  const cp=document.getElementById('iocopy'); if(cp) cp.onclick=()=>{
    const t=document.getElementById('iobox'); t.select();
    try{ navigator.clipboard.writeText(t.value).then(()=>toast('Copied')); }catch(e){ document.execCommand('copy'); toast('Copied'); }
  };
  const io=document.getElementById('iodo'); if(io) io.onclick=()=>{
    try{
      const o=JSON.parse(document.getElementById('iobox').value);
      if(Array.isArray(o)){
        if(!o.length||!o[0].name||!Array.isArray(o[0].phases)) throw 0;
        lists=o; saveLists(); ioMode=null; render(); toast('Replaced all checklists'); return;
      }
      if(!o.name||!Array.isArray(o.phases)) throw 0;
      o.id='cl_'+Math.random().toString(36).slice(2,9);
      lists.push(o); saveLists(); ioMode=null; render(); toast('Imported');
    }catch(e){ toast('That doesn’t look like valid checklist JSON'); }
  };
}
let ioText='';

function firstOpenPhase(){
  const cl=cur(); const chk=loadChk(cl.id); const st=phaseStats(cl,chk);
  for(let i=0;i<st.length;i++){ if(st[i].done<st[i].tot) return i; }
  return 0;
}

/* ================= render: run ================= */
function renderRun(){
  const cl=cur(); if(!cl){view='home';app.className='';return renderHome();}
  app.className='run-mode'+(cl.emerg?' emerg':'');
  const chk=loadChk(cl.id);
  const st=phaseStats(cl,chk);
  if(phaseIdx>=cl.phases.length) phaseIdx=0;
  const ph=cl.phases[phaseIdx];
  const tot=st.reduce((a,s)=>a+s.tot,0), done=st.reduce((a,s)=>a+s.done,0);
  const pct=tot?Math.round(done/tot*100):0;

  // find current (first unchecked) in active phase
  let currentIdx=-1;
  ph.items.some((it,ii)=>{ if((!it.k||it.k==='item')&&!chk[phaseIdx+'.'+ii]){currentIdx=ii;return true;} return false; });

  const chipHtml=(vertical)=>cl.phases.map((p,pi)=>{
    const s=st[pi];
    const cls=['chip']; if(pi===phaseIdx)cls.push('active');
    if(s.tot&&s.done===s.tot)cls.push('done'); else if(s.done>0)cls.push('part');
    return `<button class="${cls.join(' ')}" data-ph="${pi}"><span class="dot"></span>${esc(p.name)}${vertical?`<span class="cnt">${s.done}/${s.tot}</span>`:''}</button>`;
  }).join('');

  let rows='';
  ph.items.forEach((it,ii)=>{
    if(it.k==='section'){ rows+=`<div class="srow">${esc(it.c)}</div>`; return; }
    if(it.k==='note'){ rows+=`<div class="nrow">${esc(it.c)}</div>`; return; }
    const key=phaseIdx+'.'+ii, isDone=!!chk[key];
    const cls=['row']; if(isDone)cls.push('done'); if(ii===currentIdx)cls.push('current');
    rows+=`<button class="${cls.join(' ')}" data-it="${ii}" aria-pressed="${isDone}">
      <span class="box">✓</span>
      <span class="rc"><span style="min-width:0">
        <span class="ch">${esc(it.c)}</span>
        ${it.n?`<span class="nt">※ ${esc(it.n)}</span>`:''}
      </span>
      ${it.r?`<span class="lead"></span><span class="rv">${esc(it.r)}</span>`:''}
      </span>
    </button>`;
  });

  const s=st[phaseIdx];
  const phaseDone=s.tot>0&&s.done===s.tot;
  const allDone=done===tot&&tot>0;
  let banner='';
  if(allDone){
    banner=`<div class="allday"><b>All phases complete</b><span>Nice flight. Reset when you’re ready for the next leg.</span><div style="margin-top:12px"><button class="nextbtn" id="resetall2">Reset Flight</button></div></div>`;
  }else if(phaseDone){
    let nxt=-1;
    for(let i=0;i<st.length;i++){ const j=(phaseIdx+1+i)%st.length; if(st[j].done<st[j].tot){nxt=j;break;} }
    if(nxt>=0) banner=`<div class="donebanner"><div class="dtxt"><b>${esc(ph.name)} complete</b></div><button class="nextbtn" data-next="${nxt}">Next: ${esc(cl.phases[nxt].name)} →</button></div>`;
  }

  app.innerHTML=`
  <div class="topbar">
    <button class="iconbtn" id="back" aria-label="Back to checklists">‹</button>
    <div class="tb-title"><h1>${esc(cl.name)}</h1><p class="sub">${esc(cl.sub||'')}</p></div>
    <div class="pctring">${pct}%</div>
    <button class="iconbtn" id="themebtn" aria-label="Toggle theme">${theme==='dark'?'☾':theme==='light'?'☀':'◐'}</button>
  </div>
  <div class="rail" id="rail">${chipHtml(false)}</div>
  <div class="runwrap">
    <nav class="sidebar">${chipHtml(true)}</nav>
    <div class="phasepane">
      <div class="phasehead">
        <h2>${esc(ph.name)}</h2>
        <span class="count">${s.done}/${s.tot}</span>
        <button class="resetph" id="resetph">reset phase</button>
      </div>
      <div class="card">${rows}</div>
      ${banner}
    </div>
  </div>
  <div class="bottombar">
    <button class="bb-btn vspd" id="vbtn">V-Speeds ▲</button>
    <button class="bb-btn" id="resetall">Reset Flight</button>
  </div>
  ${sheetOpen?vsheetHtml(cl):''}`;

  document.getElementById('back').onclick=()=>{view='home';render();window.scrollTo(0,0);};
  document.getElementById('themebtn').onclick=()=>{
    theme=theme==='auto'?'dark':theme==='dark'?'light':'auto';
    applyTheme(); render();
  };
  app.querySelectorAll('[data-ph]').forEach(b=>b.onclick=()=>{phaseIdx=+b.dataset.ph; render(); window.scrollTo(0,0);});
  app.querySelectorAll('[data-it]').forEach(b=>b.onclick=()=>{
    const key=phaseIdx+'.'+b.dataset.it;
    if(chk[key]) delete chk[key]; else chk[key]=1;
    saveChk(cl.id,chk); render();
  });
  app.querySelectorAll('[data-next]').forEach(b=>b.onclick=()=>{phaseIdx=+b.dataset.next; render(); window.scrollTo(0,0);});
  document.getElementById('resetph').onclick=()=>{
    ph.items.forEach((it,ii)=>{delete chk[phaseIdx+'.'+ii];});
    saveChk(cl.id,chk); render();
  };
  const doReset=()=>{ saveChk(cl.id,{}); phaseIdx=0; render(); window.scrollTo(0,0); toast('Flight reset'); };
  const rb=document.getElementById('resetall');
  rb.onclick=()=>armConfirm(rb,doReset);
  const ra2=document.getElementById('resetall2'); if(ra2) ra2.onclick=()=>armConfirm(ra2,doReset);
  const vb=document.getElementById('vbtn'); vb.onclick=()=>{sheetOpen=true;render();};
  const sc=document.getElementById('scrim'); if(sc) sc.onclick=()=>{sheetOpen=false;render();};
  const scl=document.getElementById('sheetclose'); if(scl) scl.onclick=()=>{sheetOpen=false;render();};

  // keep active chip visible in the rail
  const act=app.querySelector('.rail .chip.active');
  if(act) act.scrollIntoView({inline:'center',block:'nearest'});
}

function vsheetHtml(cl){
  if(!cl.vgroups||!cl.vgroups.length) {
    return `<div class="scrim" id="scrim"></div><div class="sheet"><div class="grab"></div><p style="color:var(--muted);text-align:center;padding:20px 0">No V-speeds saved for this checklist yet — add them in the editor.</p><div style="text-align:center"><button class="bb-btn" id="sheetclose">Close</button></div></div>`;
  }
  let h=`<div class="scrim" id="scrim"></div><div class="sheet"><div class="grab"></div>
  <div style="display:flex;align-items:baseline;justify-content:space-between">
    <span class="cond" style="font-weight:700;font-size:18px">V-Speeds & Notes</span>
    <span class="mono" style="font-size:11px;color:var(--faint)">KIAS (MPH)</span>
  </div>`;
  cl.vgroups.forEach(g=>{
    h+=`<h3>${esc(g.t)}</h3><table class="vtable">`;
    g.v.forEach(v=>{
      h+=`<tr><td class="vl">${v[0]?`<b>${esc(v[0])}</b>`:''}${esc(v[1])}</td><td class="vk">${esc(v[2])} <small>(${esc(v[3])})</small></td></tr>`;
    });
    h+=`</table>`;
  });
  if(cl.notes&&cl.notes.length){
    h+=`<h3>Notes</h3><div class="notes">${cl.notes.map(n=>`<p>${esc(n)}</p>`).join('')}</div>`;
  }
  h+=`<div style="text-align:center;margin-top:16px"><button class="bb-btn" id="sheetclose">Close</button></div></div>`;
  return h;
}

/* ================= render: editor ================= */
function openEditor(id){
  if(!unlocked){ toast('Unlock editing first'); return; }
  if(id){ editDraft=JSON.parse(JSON.stringify(lists.find(l=>l.id===id))); editIsNew=false; }
  else{
    editDraft={id:'cl_'+Math.random().toString(36).slice(2,9),name:'',sub:'',
      phases:[{name:'Phase 1',items:[{c:'',r:''}]}],vgroups:[],notes:[]};
    editIsNew=true;
  }
  view='edit'; render(); window.scrollTo(0,0);
}

function renderEdit(){
  app.className='';
  const d=editDraft;
  let h=`<div class="topbar">
    <button class="iconbtn" id="edcancel" aria-label="Cancel">‹</button>
    <div class="tb-title"><h1>${editIsNew?'New checklist':'Edit checklist'}</h1></div>
    <button class="ed-save" id="edsave">Save</button>
  </div>
  <div class="ed-section"><label>Checklist name</label>
    <input type="text" id="edname" value="${esc(d.name)}" placeholder="e.g. Seneca V — Normal"></div>
  <div class="ed-section"><label>Subtitle (aircraft / tail number)</label>
    <input type="text" id="edsub" value="${esc(d.sub||'')}" placeholder="e.g. Piper PA-34-220T · N12345"></div>`;

  d.phases.forEach((ph,pi)=>{
    h+=`<div class="ed-phase" data-pi="${pi}">
      <div class="ed-phead">
        <input type="text" value="${esc(ph.name)}" data-pname="${pi}" placeholder="Phase name">
        <button class="mini" data-pup="${pi}" aria-label="Move phase up">↑</button>
        <button class="mini" data-pdn="${pi}" aria-label="Move phase down">↓</button>
        <button class="mini del" data-pdel="${pi}" aria-label="Delete phase">✕</button>
      </div>`;
    ph.items.forEach((it,ii)=>{
      const kind=it.k||'item';
      h+=`<div class="ed-item k-${kind}">
        <input type="text" class="chl" value="${esc(it.c)}" data-c="${pi}.${ii}" placeholder="${kind==='item'?'Challenge':kind==='section'?'Section header':'Note text'}">
        ${kind==='item'?`<input type="text" class="rsp" value="${esc(it.r||'')}" data-r="${pi}.${ii}" placeholder="Response">`:''}
        <button class="mini" data-iup="${pi}.${ii}" aria-label="Move up">↑</button>
        <button class="mini" data-idn="${pi}.${ii}" aria-label="Move down">↓</button>
        <button class="mini" data-imore="${pi}.${ii}" aria-label="More options">⋯</button>
        <button class="mini del" data-idel="${pi}.${ii}" aria-label="Delete item">✕</button>
      </div>`;
      if(kind==='item'){
        h+=`<div class="ed-item" style="padding-top:0;border-top:none">
          <input type="text" value="${esc(it.n||'')}" data-n="${pi}.${ii}" placeholder="Caution / note (optional)" style="font-size:12.5px;color:var(--amb)">
        </div>`;
      }
      if(openItem===pi+'.'+ii){
        h+=`<div class="ed-more">
          <span class="lbl">Type</span>
          <select data-ikind="${pi}.${ii}">
            <option value="item"${kind==='item'?' selected':''}>Challenge / response</option>
            <option value="section"${kind==='section'?' selected':''}>Section header</option>
            <option value="note"${kind==='note'?' selected':''}>Note</option>
          </select>
          <button data-idup="${pi}.${ii}">Duplicate</button>
          ${d.phases.length>1?`<span class="lbl">Move to</span>
          <select data-imove="${pi}.${ii}">
            <option value="">this phase</option>
            ${d.phases.map((p2,pj)=>pj===pi?'':`<option value="${pj}">${esc(p2.name||'Phase '+(pj+1))}</option>`).join('')}
          </select>`:''}
        </div>`;
      }
    });
    h+=`<div class="ed-add">
      <button data-addi="${pi}">＋ Item</button>
      <button data-adds="${pi}">＋ Section header</button>
      <button data-addn="${pi}">＋ Note</button>
    </div></div>`;
  });
  h+=`<button class="ed-bigadd" id="addphase">＋ Add phase</button>`;

  /* ---- V-speed groups ---- */
  d.vgroups=d.vgroups||[];
  h+=`<div class="ed-section"><label>V-speeds shown in the reference sheet</label></div>`;
  d.vgroups.forEach((g,gi)=>{
    h+=`<div class="ed-phase">
      <div class="ed-phead">
        <input type="text" value="${esc(g.t||'')}" data-vgt="${gi}" placeholder="Group heading, e.g. Single Engine">
        <button class="mini" data-vgup="${gi}" aria-label="Move group up">↑</button>
        <button class="mini" data-vgdn="${gi}" aria-label="Move group down">↓</button>
        <button class="mini del" data-vgdel="${gi}" aria-label="Delete group">✕</button>
      </div>`;
    (g.v||[]).forEach((row,ri)=>{
      h+=`<div class="vrow">
        <input type="text" class="va" value="${esc(row[0]||'')}" data-vc="${gi}.${ri}.0" placeholder="Vyse">
        <input type="text" class="vd" value="${esc(row[1]||'')}" data-vc="${gi}.${ri}.1" placeholder="Best Rate 1 Eng.">
        <input type="text" class="vk" value="${esc(row[2]||'')}" data-vc="${gi}.${ri}.2" placeholder="KIAS">
        <input type="text" class="vm" value="${esc(row[3]||'')}" data-vc="${gi}.${ri}.3" placeholder="MPH">
        <button class="mini" data-vrup="${gi}.${ri}" aria-label="Move speed up">↑</button>
        <button class="mini" data-vrdn="${gi}.${ri}" aria-label="Move speed down">↓</button>
        <button class="mini del" data-vrdel="${gi}.${ri}" aria-label="Delete speed">✕</button>
      </div>`;
    });
    h+=`<div class="ed-add"><button data-vradd="${gi}">＋ Speed</button></div></div>`;
  });
  h+=`<button class="ed-bigadd" id="addvgroup">＋ Add V-speed group</button>
  <label class="ed-toggle"><input type="checkbox" id="edemerg" ${d.emerg?'checked':''}> Emergency checklist (red styling on the home screen)</label>
  <div class="ed-section" style="margin-bottom:30px">
    <label>Notes shown in the V-speeds sheet (one per line)</label>
    <textarea class="io-box" id="ednotes" style="height:110px">${esc((d.notes||[]).join('\n'))}</textarea>
  </div>`;
  app.innerHTML=h;

  const syncInputs=()=>{
    d.name=document.getElementById('edname').value;
    d.sub=document.getElementById('edsub').value;
    d.notes=document.getElementById('ednotes').value.split('\n').map(s=>s.trim()).filter(Boolean);
    app.querySelectorAll('[data-pname]').forEach(i=>{d.phases[+i.dataset.pname].name=i.value;});
    app.querySelectorAll('[data-c]').forEach(i=>{const[p,x]=i.dataset.c.split('.');d.phases[+p].items[+x].c=i.value;});
    app.querySelectorAll('[data-r]').forEach(i=>{const[p,x]=i.dataset.r.split('.');d.phases[+p].items[+x].r=i.value;});
    app.querySelectorAll('[data-n]').forEach(i=>{const[p,x]=i.dataset.n.split('.');d.phases[+p].items[+x].n=i.value;});
    const em=document.getElementById('edemerg'); if(em) d.emerg=em.checked;
    app.querySelectorAll('[data-vgt]').forEach(i=>{d.vgroups[+i.dataset.vgt].t=i.value;});
    app.querySelectorAll('[data-vc]').forEach(i=>{const[g,r,c]=i.dataset.vc.split('.').map(Number);d.vgroups[g].v[r][c]=i.value;});
  };
  const rerender=()=>{syncInputs();renderEdit();};

  const cx=document.getElementById('edcancel');
  cx.onclick=()=>{
    if(!cx.dataset.armed) toast('Tap back again to discard changes');
    armConfirm(cx,()=>{ editDraft=null; view='home'; render(); },'✕');
  };
  document.getElementById('edsave').onclick=()=>{
    syncInputs();
    if(!d.name.trim()){toast('Give the checklist a name');return;}
    d.phases.forEach(ph=>{ph.items=ph.items.filter(it=>String(it.c||'').trim()!=='');});
    d.phases=d.phases.filter(ph=>ph.items.length||ph.name.trim());
    d.vgroups=(d.vgroups||[]).map(g=>({t:g.t,v:(g.v||[]).filter(r=>r.some(c=>String(c||'').trim()!==''))}))
                             .filter(g=>g.v.length||String(g.t||'').trim()!=='');
    openItem=null;
    d.edited=true;
    const ix=lists.findIndex(l=>l.id===d.id);
    if(ix>=0)lists[ix]=d; else lists.push(d);
    saveLists(); editDraft=null; view='home'; render(); toast('Saved');
  };
  document.getElementById('addphase').onclick=()=>{syncInputs();d.phases.push({name:'',items:[{c:'',r:''}]});renderEdit();};
  app.querySelectorAll('[data-addi]').forEach(b=>b.onclick=()=>{syncInputs();d.phases[+b.dataset.addi].items.push({c:'',r:''});renderEdit();});
  app.querySelectorAll('[data-adds]').forEach(b=>b.onclick=()=>{syncInputs();d.phases[+b.dataset.adds].items.push({k:'section',c:''});renderEdit();});
  app.querySelectorAll('[data-addn]').forEach(b=>b.onclick=()=>{syncInputs();d.phases[+b.dataset.addn].items.push({k:'note',c:''});renderEdit();});
  app.querySelectorAll('[data-pdel]').forEach(b=>b.onclick=()=>{
    if(!b.dataset.armed) toast('Tap ✕ again to delete this phase');
    armConfirm(b,()=>{syncInputs();d.phases.splice(+b.dataset.pdel,1);renderEdit();},'✕');
  });
  app.querySelectorAll('[data-pup]').forEach(b=>b.onclick=()=>{const i=+b.dataset.pup;if(i>0){syncInputs();[d.phases[i-1],d.phases[i]]=[d.phases[i],d.phases[i-1]];renderEdit();}});
  app.querySelectorAll('[data-pdn]').forEach(b=>b.onclick=()=>{const i=+b.dataset.pdn;if(i<d.phases.length-1){syncInputs();[d.phases[i+1],d.phases[i]]=[d.phases[i],d.phases[i+1]];renderEdit();}});
  app.querySelectorAll('[data-idel]').forEach(b=>b.onclick=()=>{const[p,x]=b.dataset.idel.split('.').map(Number);syncInputs();d.phases[p].items.splice(x,1);renderEdit();});
  app.querySelectorAll('[data-iup]').forEach(b=>b.onclick=()=>{const[p,x]=b.dataset.iup.split('.').map(Number);if(x>0){syncInputs();const a=d.phases[p].items;[a[x-1],a[x]]=[a[x],a[x-1]];renderEdit();}});
  app.querySelectorAll('[data-idn]').forEach(b=>b.onclick=()=>{const[p,x]=b.dataset.idn.split('.').map(Number);const a=d.phases[p].items;if(x<a.length-1){syncInputs();[a[x+1],a[x]]=[a[x],a[x+1]];renderEdit();}});

  /* per-item extra controls */
  app.querySelectorAll('[data-imore]').forEach(b=>b.onclick=()=>{
    syncInputs(); openItem = openItem===b.dataset.imore ? null : b.dataset.imore; renderEdit();
  });
  app.querySelectorAll('[data-ikind]').forEach(sel=>sel.onchange=()=>{
    const[p,x]=sel.dataset.ikind.split('.').map(Number); syncInputs();
    const it=d.phases[p].items[x];
    if(sel.value==='item'){ delete it.k; it.r=it.r||''; }
    else { it.k=sel.value; delete it.r; delete it.n; }
    renderEdit();
  });
  app.querySelectorAll('[data-idup]').forEach(b=>b.onclick=()=>{
    const[p,x]=b.dataset.idup.split('.').map(Number); syncInputs();
    d.phases[p].items.splice(x+1,0,JSON.parse(JSON.stringify(d.phases[p].items[x])));
    openItem=null; renderEdit();
  });
  app.querySelectorAll('[data-imove]').forEach(sel=>sel.onchange=()=>{
    if(sel.value==='') return;
    const[p,x]=sel.dataset.imove.split('.').map(Number); syncInputs();
    const it=d.phases[p].items.splice(x,1)[0];
    d.phases[+sel.value].items.push(it);
    openItem=null; renderEdit(); toast('Moved to '+(d.phases[+sel.value].name||'phase'));
  });

  /* V-speed groups */
  document.getElementById('addvgroup').onclick=()=>{syncInputs();d.vgroups.push({t:'',v:[['','','','']]});renderEdit();};
  app.querySelectorAll('[data-vradd]').forEach(b=>b.onclick=()=>{syncInputs();d.vgroups[+b.dataset.vradd].v.push(['','','','']);renderEdit();});
  app.querySelectorAll('[data-vgdel]').forEach(b=>b.onclick=()=>{
    if(!b.dataset.armed) toast('Tap ✕ again to delete this group');
    armConfirm(b,()=>{syncInputs();d.vgroups.splice(+b.dataset.vgdel,1);renderEdit();},'✕');
  });
  app.querySelectorAll('[data-vgup]').forEach(b=>b.onclick=()=>{const i=+b.dataset.vgup;if(i>0){syncInputs();[d.vgroups[i-1],d.vgroups[i]]=[d.vgroups[i],d.vgroups[i-1]];renderEdit();}});
  app.querySelectorAll('[data-vgdn]').forEach(b=>b.onclick=()=>{const i=+b.dataset.vgdn;if(i<d.vgroups.length-1){syncInputs();[d.vgroups[i+1],d.vgroups[i]]=[d.vgroups[i],d.vgroups[i+1]];renderEdit();}});
  app.querySelectorAll('[data-vrdel]').forEach(b=>b.onclick=()=>{const[g,r]=b.dataset.vrdel.split('.').map(Number);syncInputs();d.vgroups[g].v.splice(r,1);renderEdit();});
  app.querySelectorAll('[data-vrup]').forEach(b=>b.onclick=()=>{const[g,r]=b.dataset.vrup.split('.').map(Number);if(r>0){syncInputs();const a=d.vgroups[g].v;[a[r-1],a[r]]=[a[r],a[r-1]];renderEdit();}});
  app.querySelectorAll('[data-vrdn]').forEach(b=>b.onclick=()=>{const[g,r]=b.dataset.vrdn.split('.').map(Number);const a=d.vgroups[g].v;if(r<a.length-1){syncInputs();[a[r+1],a[r]]=[a[r],a[r+1]];renderEdit();}});
}

/* ================= misc ================= */
/* two-tap confirm: first tap arms the button, second tap (within 3.5s) runs fn.
   Replaces window.confirm(), which sandboxed pages block. */
function armConfirm(btn,fn,label){
  if(btn.dataset.armed){ delete btn.dataset.armed; btn.classList.remove('armed'); fn(); return; }
  btn.dataset.armed='1';
  btn.dataset.prev=btn.textContent;
  btn.textContent=label||'Tap again to confirm';
  btn.classList.add('armed');
  setTimeout(()=>{
    if(btn.isConnected&&btn.dataset.armed){
      delete btn.dataset.armed; btn.textContent=btn.dataset.prev; btn.classList.remove('armed');
    }
  },3500);
}

let toastT=null;
function toast(msg){
  const old=document.querySelector('.toast'); if(old)old.remove();
  const t=document.createElement('div'); t.className='toast'; t.textContent=msg;
  document.body.appendChild(t);
  clearTimeout(toastT); toastT=setTimeout(()=>t.remove(),1800);
}

function render(){
  if(view==='run') renderRun();
  else if(view==='edit') renderEdit();
  else renderHome();
}
render();
</script>
